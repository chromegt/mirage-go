name: MirageGo
options:
  bundleIdPrefix: net.summitclient
  deploymentTarget:
    iOS: "17.4"            # RemotePairing tunnel over the loopback VPN needs iOS 17.4+
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
targets:
  MirageGo:
    type: application
    platform: iOS
    sources:
      - path: MirageGo
    entitlements:
      path: MirageGo/MirageGo.entitlements
      properties: {}
    info:
      path: MirageGo/Info.plist
      properties:
        CFBundleDisplayName: Mirage Go
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Mirage Go uses location to stay alive in the background and keep your simulated location active.
        NSLocationAlwaysAndWhenInUseUsageDescription: Mirage Go uses location to stay alive in the background and keep your simulated location active.
        NSLocalNetworkUsageDescription: Mirage Go talks to your iPhone's own developer service through LocalDev VPN.
        NSBonjourServices: [_remotepairing._tcp, _remotepairing-pairable-host._tcp, _remoted._tcp]
        LSApplicationQueriesSchemes: [localdevvpn]
        CFBundleURLTypes:
          - CFBundleURLName: net.summitclient.mirage-go
            CFBundleURLSchemes: [miragego]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pairing file
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.property-list, public.data]
            CFBundleTypeExtensions: [plist, mobiledevicepairing, mobiledevicepair]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.summitclient.mirage-go
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Vendor/idevice
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/idevice
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/idevice
        OTHER_LDFLAGS: -lidevice_ffi -lc++ -lz
