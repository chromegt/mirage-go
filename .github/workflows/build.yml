name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # StikDebug commit whose vendored idevice.h / libidevice_ffi.a pair we build against (header is committed in Vendor/).
  IDEVICE_REF: 94bc9e8cf3b41f32f125f046abf33d913f4e1b2d
  IDEVICE_A_SIZE: "97089368"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Toolchain info
        run: xcodebuild -version

      - name: Fetch prebuilt idevice FFI library
        run: |
          set -e
          mkdir -p Vendor/idevice
          BASE="https://raw.githubusercontent.com/StikDebug/StikDebug/${IDEVICE_REF}/StikDebug/idevice"
          if [ ! -s Vendor/idevice/libidevice_ffi.a ]; then
            curl -fL --retry 3 "$BASE/libidevice_ffi.a" -o Vendor/idevice/libidevice_ffi.a
          fi
          test -s Vendor/idevice/idevice.h || curl -fL --retry 3 "$BASE/idevice.h" -o Vendor/idevice/idevice.h
          test -s Vendor/idevice/module.modulemap || curl -fL --retry 3 "$BASE/module.modulemap" -o Vendor/idevice/module.modulemap
          ls -la Vendor/idevice
          test "$(stat -f%z Vendor/idevice/libidevice_ffi.a)" -eq "$IDEVICE_A_SIZE"
          head -c 8 Vendor/idevice/libidevice_ffi.a | grep -q '!<arch>'
          grep -q '\[system\]' Vendor/idevice/module.modulemap
          lipo -info Vendor/idevice/libidevice_ffi.a
          for s in rp_pairing_file_read rp_pairing_file_free tunnel_create_rppairing adapter_free rsd_handshake_free \
                   rsd_service_available lockdownd_connect_rsd lockdownd_get_value lockdownd_client_free image_mounter_connect_rsd \
                   image_mounter_copy_devices image_mounter_mount_personalized_with_callback_rsd image_mounter_free \
                   remote_server_connect_rsd remote_server_free location_simulation_new location_simulation_set \
                   location_simulation_clear location_simulation_free idevice_error_free idevice_data_free plist_free \
                   plist_get_uint_val idevice_init_logger; do
            grep -q "\b$s(" Vendor/idevice/idevice.h || { echo "missing FFI symbol: $s"; exit 1; }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild clean archive -project MirageGo.xcodeproj -scheme MirageGo -configuration Debug \
            -archivePath build/MirageGo.xcarchive \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" IPHONEOS_DEPLOYMENT_TARGET=17.4 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|ARCHIVE|Archive" || true
          grep -q "ARCHIVE SUCCEEDED" build.log || { echo "----- last 120 lines -----"; tail -n 120 build.log; exit 1; }

      - name: Package IPA
        run: |
          APP=build/MirageGo.xcarchive/Products/Applications/MirageGo.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr MirageGo.ipa Payload
          ls -la MirageGo.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: MirageGo-ipa
          path: MirageGo.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
